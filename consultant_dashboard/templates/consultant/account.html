{% extends "shared/base.html" %}
{% block body %}
  {% include "consultant/_nav.html" %}
  <div class="split">
    <div class="card">
      <div class="label">{{ brand }}</div>
      <h1>Consultant Account</h1>
      <p class="muted">{{ consultant.name }} · {{ consultant.email }}</p>
      <p class="muted">Use this page to change your password.</p>
    </div>
    <div class="card">
      <div class="label">Security</div>
      <h2>Change Password</h2>
      <form method="post">
        <label class="field-label">Current Password</label>
        <input name="current_password" type="password" required>
        <label class="field-label">New Password</label>
        <input name="new_password" type="password" required>
        <div class="field-help">Use at least 8 characters.</div>
        <label class="field-label">Confirm New Password</label>
        <input name="confirm_password" type="password" required>
        <button type="submit">Update Password</button>
      </form>
      <form method="post" action="{{ tenant_url_for('auth.consultant_logout') }}" style="margin-top: 16px;">
        <button type="submit" class="button-secondary">Log Out</button>
      </form>
    </div>
  </div>
{% endblock %}
