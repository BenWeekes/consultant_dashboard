<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or brand }}</title>
    <style>
      :root {
        --accent: #0f6b42;
        --accent-soft: rgba(15, 107, 66, 0.08);
        --accent-soft-solid: #ebf4ec;
        --text-main: #132218;
        --text-muted: #5a7261;
        --bg-start: #f4f7f2;
        --bg-end: #eef5ef;
      }
      body.theme-consultant {
        --accent: #6b9bd1;
        --accent-soft: rgba(107, 155, 209, 0.12);
        --accent-soft-solid: #edf3fb;
        --text-main: #17314f;
        --text-muted: #58708b;
        --bg-start: #f4f8fd;
        --bg-end: #ecf3fb;
      }
      body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%); color: var(--text-main); }
      .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px; }
      .card { background: white; border-radius: 18px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
      .auth-shell { max-width: 460px; margin: 48px auto 0; }
      .grid { display: grid; gap: 16px; }
      .stats { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
      .stat { background: var(--accent-soft-solid); border-radius: 14px; padding: 16px; }
      .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); }
      .field-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text-main); }
      .field-help { margin-top: -6px; font-size: 12px; color: var(--text-muted); }
      .phone-row { display: grid; gap: 12px; grid-template-columns: 200px 1fr; align-items: end; }
      .tooltip {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: var(--accent-soft-solid);
        color: var(--accent);
        font-size: 12px;
        cursor: help;
      }
      .tooltip::after {
        content: attr(data-tooltip);
        position: absolute;
        left: 50%;
        bottom: calc(100% + 10px);
        transform: translateX(-50%);
        width: 240px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #132218;
        color: white;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.4;
        box-shadow: 0 10px 24px rgba(0,0,0,.18);
        opacity: 0;
        pointer-events: none;
        transition: opacity .15s ease;
        z-index: 20;
        text-transform: none;
        letter-spacing: normal;
        white-space: normal;
      }
      .tooltip::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: calc(100% + 4px);
        transform: translateX(-50%);
        border: 6px solid transparent;
        border-top-color: #132218;
        opacity: 0;
        transition: opacity .15s ease;
        pointer-events: none;
        z-index: 20;
      }
      .tooltip:hover::after,
      .tooltip:hover::before,
      .tooltip:focus-visible::after,
      .tooltip:focus-visible::before {
        opacity: 1;
      }
      .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
      input, select, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #bfd0c3; box-sizing: border-box; background: #fff; }
      textarea { min-height: 120px; resize: vertical; }
      input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 35%, white); border-color: var(--accent); }
      button { background: var(--accent); color: white; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; }
      .button-danger { background: #b94242; }
      .muted { color: var(--text-muted); }
      .error { color: #a32424; margin-bottom: 12px; }
      .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft-solid); color: var(--accent); font-size: 12px; }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .split { display: grid; gap: 16px; grid-template-columns: 1.2fr .8fr; }
      .nav { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
      .nav a { display: inline-block; padding: 10px 14px; border-radius: 999px; background: var(--accent-soft); text-decoration: none; }
      .stack { display: grid; gap: 12px; }
      .list { display: grid; gap: 12px; }
      .item { padding: 14px; border: 1px solid #d8e6db; border-radius: 14px; background: #fbfdfb; }
      .table { width: 100%; border-collapse: collapse; }
      .table th, .table td { text-align: left; padding: 12px; border-bottom: 1px solid #e3ece4; vertical-align: top; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      form { display: grid; gap: 12px; }
      a { color: var(--accent); }
      .toast-stack {
        position: fixed;
        top: 20px;
        right: 20px;
        display: grid;
        gap: 10px;
        z-index: 1000;
      }
      .toast {
        min-width: 260px;
        max-width: 360px;
        padding: 12px 14px;
        border-radius: 14px;
        box-shadow: 0 12px 28px rgba(0,0,0,.16);
        background: white;
        border-left: 4px solid var(--accent);
        color: var(--text-main);
        opacity: 1;
        transform: translateY(0);
        transition: opacity .35s ease, transform .35s ease;
      }
      .toast.toast-error { border-left-color: #c54444; }
      .toast.toast-hidden { opacity: 0; transform: translateY(-8px); }
      @media (max-width: 800px) {
        .split { grid-template-columns: 1fr; }
        .phone-row { grid-template-columns: 1fr; }
        .toast-stack { left: 16px; right: 16px; top: 16px; }
        .toast { min-width: 0; max-width: none; }
      }
    </style>
  </head>
  <body class="theme-{{ theme or 'default' }}">
    <div class="wrap">
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="toast-stack" id="toast-stack">
          {% for category, message in messages %}
            <div class="toast {% if category == 'error' %}toast-error{% endif %}" data-toast>{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
      {% endwith %}
      {% block body %}{% endblock %}
    </div>
    <script>
      const toasts = document.querySelectorAll('[data-toast]');
      toasts.forEach((toast, index) => {
        const delay = 2200 + (index * 250);
        window.setTimeout(() => {
          toast.classList.add('toast-hidden');
          window.setTimeout(() => toast.remove(), 400);
        }, delay);
      });
    </script>
  </body>
</html>
