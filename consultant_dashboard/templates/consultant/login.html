{% extends "shared/base.html" %}
{% block body %}
  <div class="auth-shell">
  <div class="card">
    <div class="label">{{ brand }}</div>
    <h1>Consultant Login</h1>
    <form method="post">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Send verification code</button>
    </form>
    {% if show_google_login %}
      <div class="muted" style="margin: 8px 0; text-align: center;">or</div>
      <a href="{{ tenant_url_for('auth.consultant_google') }}" class="button-secondary button-link" style="text-align: center;">Sign in with Google</a>
    {% endif %}
  </div>
  </div>
{% endblock %}
