{% extends "shared/base.html" %}
{% block body %}
  {% include "admin/_nav.html" %}
  <div class="card" style="max-width: 820px; margin: 0 auto;">
    <div class="panel-head">
      <div class="panel-title">
        <div class="panel-kicker">Vendor</div>
        <h1>{{ vendor.name }}</h1>
      </div>
    </div>
    <div class="muted">Slug: <span class="mono">{{ vendor.slug }}</span></div>
    <form method="post" class="section-stack" data-vendor-form>
      <label class="field-label" for="domain">Domain</label>
      <input id="domain" name="domain" value="{{ domain or '' }}" required data-vendor-domain>

      <div class="field-grid-two">
        <div class="field-group-inline">
          <label class="field-label" for="slug">Slug</label>
          <input id="slug" name="slug" value="{{ vendor.slug }}" required>
        </div>
        <div class="field-group-inline">
          <label class="field-label" for="name">Name</label>
          <input id="name" name="name" value="{{ vendor.name }}" required data-vendor-name>
        </div>
      </div>

      <div class="field-grid-two">
        <div class="field-group-inline">
          <label class="field-label" for="storage_root">Storage Root</label>
          <input id="storage_root" name="storage_root" value="{{ vendor.storage_root }}" required data-vendor-storage-root>
        </div>
        <div class="field-group-inline">
          <label class="field-label" for="www_root">WWW Root</label>
          <input id="www_root" name="www_root" value="{{ vendor.www_root }}" required data-vendor-www-root>
        </div>
      </div>

      <div class="actions">
        <button type="submit">Save Vendor</button>
        <a href="{{ tenant_url_for('web.admin_vendors') }}" class="button-secondary button-link">Back to Vendors</a>
      </div>
    </form>
  </div>
{% endblock %}
